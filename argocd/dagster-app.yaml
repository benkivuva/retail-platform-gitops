apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagster-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/benkivuva/retail-platform-gitops.git
    targetRevision: main
    path: apps/dagster
  destination:
    server: https://kubernetes.default.svc
    namespace: dagster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
