apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: retail-platform-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/benkivuva/retail-platform-gitops.git
      revision: main
      directories:
      - path: apps/*
  template:
    metadata:
      name: '{{path.basename}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/benkivuva/retail-platform-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
