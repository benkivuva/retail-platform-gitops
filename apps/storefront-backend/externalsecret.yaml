apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: storefront-db-secret
  namespace: storefront-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: storefront-db-secret
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: storefront-db-url
