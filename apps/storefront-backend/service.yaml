apiVersion: v1
kind: Service
metadata:
  name: storefront-api
  namespace: storefront-backend
  labels:
    app: storefront-api
spec:
  type: ClusterIP
  selector:
    app: storefront-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: internal
      port: 9090
      targetPort: internal
      protocol: TCP
