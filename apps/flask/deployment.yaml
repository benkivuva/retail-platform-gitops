apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      serviceAccountName: flask-ksa
      containers:
        - name: flask
          # We are pulling the exact image we just pushed to GCP
          image: us-central1-docker.pkg.dev/retail-data-platform-511008/dev-retail-platform/flask-app:4942fd7667d1dc1771a535a6f9be3c0771c73d37
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: flask-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi