apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flask-db-secret
  namespace: flask
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: flask-db-secret
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: flask-db-url
