apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-db-secret
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: dagster-db-secret
    creationPolicy: Owner
  data:
  - secretKey: DAGSTER_DB_PASSWORD
    remoteRef:
      key: dagster-db-password