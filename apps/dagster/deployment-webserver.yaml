apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  namespace: dagster
  labels:
    app: dagster-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-webserver
  template:
    metadata:
      labels:
        app: dagster-webserver
    spec:
      serviceAccountName: dagster-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: webserver
          image: us-central1-docker.pkg.dev/retail-data-platform-511008/dev-retail-platform/dagster:main-latest
          imagePullPolicy: Always
          command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "orchestration.definitions"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dagster-config
          volumeMounts:
            - name: dagster-home
              mountPath: /app/.dagster
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dagster-home
          emptyDir: {}
