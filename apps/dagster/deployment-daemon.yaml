apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-daemon
  namespace: dagster
  labels:
    app: dagster-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-daemon
  template:
    metadata:
      labels:
        app: dagster-daemon
    spec:
      serviceAccountName: dagster-ksa
      containers:
        - name: daemon
          image: us-central1-docker.pkg.dev/retail-data-platform-511008/dev-retail-platform/dagster:main-latest
          imagePullPolicy: Always
          command: ["dagster-daemon", "run", "-m", "orchestration.definitions"]
          envFrom:
            - configMapRef:
                name: dagster-config
          env:
            - name: DAGSTER_PG_URL
              valueFrom:
                secretKeyRef:
                  name: dagster-db-secret
                  key: DAGSTER_PG_URL
          volumeMounts:
            - name: dagster-home
              mountPath: /app/.dagster
            - name: dagster-config-vol
              mountPath: /app/.dagster/dagster.yaml
              subPath: dagster.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dagster-home
          emptyDir: {}
        - name: dagster-config-vol
          configMap:
            name: dagster-config
