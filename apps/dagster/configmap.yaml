apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  namespace: dagster
data:
  GCP_PROJECT: "retail-data-platform-511008"
  DBT_DATASET: "staging"
  DBT_PROFILES_DIR: "/app/dbt"
  DAGSTER_HOME: "/app/.dagster"
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          hostname: "10.36.0.3"
          username: "dagsteruser"
          db_name: "dagsterdb"
          password: { env: "DAGSTER_DB_PASSWORD" }