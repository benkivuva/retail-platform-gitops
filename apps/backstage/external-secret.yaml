apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_URL
    remoteRef:
      key: backstage-db-url
  - secretKey: AUTH_GITHUB_CLIENT_ID
    remoteRef:
      key: backstage-github-client-id
  - secretKey: AUTH_GITHUB_CLIENT_SECRET
    remoteRef:
      key: backstage-github-client-secret
